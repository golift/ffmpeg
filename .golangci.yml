version: "2"
linters:
  default: all
  disable:
    - wsl # deprecated.
    - exhaustruct # deprecated.
    - exhaustruct_v5 # Config and the stream types leave sync and buffer fields at zero.
    - gomodguard # deprecated.
    - depguard # flags testify.
  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - commentedOutCode
      settings:
        unnamedResult:
          checkExported: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
